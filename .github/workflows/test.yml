name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
        exclude:
          - os: ubuntu-latest      # the newest Ubuntu image no longer offers Python 3.9
            python: "3.9"
        include:
          - os: ubuntu-22.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tests/test_orders.py
      - run: python -c "import json; [json.load(open(f)) for f in ('hooks/hooks.json', '.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
